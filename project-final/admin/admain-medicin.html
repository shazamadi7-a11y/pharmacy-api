async function fetchMedicines() {
    const tbody = document.getElementById('medicines-table');
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-10">Loading...</td></tr>`;

    try {
        const res = await fetch(`${API_BASE}/medicines?per_page=1000&t=${Date.now()}`, {
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept': 'application/json'
            }
        });

        const result = await res.json();

        console.log("FULL RESPONSE:", result);

        // ⭐ الحل الأساسي هنا
        const medicines = result?.data?.data ?? [];

        console.log("EXTRACTED:", medicines);

        medicinesData = medicines;
        renderTable(medicinesData);

    } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td class="text-red-500 text-center">Error loading data</td></tr>`;
    }
}

// Fetch Categories
async function fetchCategories() {
    try {
        const res = await fetch(`${API_BASE}/categories`, {
            headers: { 'Authorization': `Bearer ${TOKEN}` }
        });

        const result = await res.json();
        categoriesData = result.data?.data || result.data || [];
        
        const select = document.getElementById("med-category");
        if (categoriesData.length === 0) {
            select.innerHTML = '<option value="">لا توجد تصنيفات - أضف تصنيف أولاً</option>';
        } else {
            select.innerHTML = categoriesData.map(cat => `
                <option value="${cat.id}">
                    ${cat.name}
                </option>
            `).join('');
        }
        console.log("📂 Categories loaded:", categoriesData.length);
    } catch (err) {
        console.error("Failed to load categories", err);
        const select = document.getElementById("med-category");
        select.innerHTML = '<option value="">خطأ في تحميل التصنيفات</option>';
    }
}

// Render Table - محسنة
function renderTable(medicines) {
    const tbody = document.getElementById('medicines-table');
    tbody.innerHTML = '';

    console.log(`🎯 renderTable: ${medicines.length} medicines`);

    if (medicines.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="text-center py-12 text-gray-500">لا توجد أدوية - أضف دواء جديد</td></tr>`;
        return;
    }

    let html = '';
    medicines.forEach(med => {
        const category = categoriesData.find(c => String(c.id) === String(med.category_id));
        
        html += `
            <tr style="border-bottom: 1px solid #e2e8f0; transition: background-color 0.2s;" 
                class="hover:bg-slate-50">
                <td style="padding: 20px 24px; font-weight: 600;">${med.brand_name || 'غير محدد'}</td>
                <td style="padding: 20px 24px;">
                    ${category ? category.name : `<span style="color:#ef4444;">غير مصنف (${med.category_id})</span>`}
                </td>
                <td style="padding: 20px 24px; font-weight: 500;">$${parseFloat(med.price || 0).toFixed(2)}</td>
                <td style="padding: 20px 24px; text-align: center; font-weight: 600; 
                           color: ${med.stock_quantity > 10 ? '#16a34a' : med.stock_quantity > 0 ? '#d97706' : '#ef4444'};">
                    ${med.stock_quantity || 0}
                </td>
                <td style="padding: 20px 24px; text-align: center; color: #64748b;">
                    ${med.expiry_date ? med.expiry_date.split('T')[0] : '-'}
                </td>
                <td style="padding: 20px 24px; text-align: center;">
                    <button onclick="viewMedicine(${med.id})" class="p-2 hover:bg-blue-50 text-blue-600 rounded-xl" title="View">
                        <span class="material-symbols-outlined" style="font-size: 20px;">visibility</span>
                    </button>
                    <button onclick="editMedicine(${med.id})" class="p-2 hover:bg-amber-50 text-amber-600 rounded-xl" title="Edit">
                        <span class="material-symbols-outlined" style="font-size: 20px;">edit</span>
                    </button>
                    <button onclick="deleteMedicine(${med.id})" class="p-2 hover:bg-red-50 text-red-600 rounded-xl" title="Delete">
                        <span class="material-symbols-outlined" style="font-size: 20px;">delete</span>
                    </button>
                </td>
            </tr>
        `;
    });

    tbody.innerHTML = html;
    console.log("🏁 Table rendered");
}

// View Medicine
function viewMedicine(id) {
    const med = medicinesData.find(m => m.id === id);
    if (!med) return alert("Medicine not found");

    alert(`
📋 Medicine Details:
━━━━━━━━━━━━━━━━━━━━━
Brand: ${med.brand_name}
Scientific: ${med.scientific_name || '-'}
Category: ${categoriesData.find(c => c.id == med.category_id)?.name || 'Uncategorized'}
Price: $${med.price}
Stock: ${med.stock_quantity}
Expiry: ${med.expiry_date || '-'}
    `);
}

// Edit Medicine
function editMedicine(id) {
    const med = medicinesData.find(m => m.id == id);
    if (!med) return;

    currentEditId = id;

    document.getElementById("med-category").value = med.category_id || "";
    document.getElementById("med-brand").value = med.brand_name || "";
    document.getElementById("med-scientific").value = med.scientific_name || "";
    document.getElementById("med-price").value = med.price || "";
    document.getElementById("med-stock").value = med.stock_quantity || "";
    document.getElementById("med-expiry").value = med.expiry_date ? med.expiry_date.split("T")[0] : "";

    document.getElementById("modal-title").textContent = "Edit Medicine";
    document.getElementById("medicine-modal").classList.remove("hidden");
}

// Open Add Modal
function openAddModal() {
    currentEditId = null;
    // Clear form
    document.getElementById("med-category").value = "";
    document.getElementById("med-brand").value = "";
    document.getElementById("med-scientific").value = "";
    document.getElementById("med-price").value = "";
    document.getElementById("med-stock").value = "";
    document.getElementById("med-expiry").value = "";
    
    document.getElementById('modal-title').textContent = 'Add New Medicine';
    document.getElementById('medicine-modal').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('medicine-modal').classList.add('hidden');
}

// Save Medicine (Add or Update) - محسنة

// استبدل دالة saveMedicine بالكامل بهذه النسخة المعدلة جذرياً
// استبدل دالة saveMedicine بهذه النسخة
async function saveMedicine() {
    const medicineData = {
        category_id: parseInt(document.getElementById("med-category").value),
        brand_name: document.getElementById("med-brand").value.trim(),
        scientific_name: document.getElementById("med-scientific").value.trim(),
        price: parseFloat(document.getElementById("med-price").value),
        stock_quantity: parseInt(document.getElementById("med-stock").value),
        expiry_date: document.getElementById("med-expiry").value,
        dosage_form: "tablet",
        requires_prescription: false,
        is_available: true
    };

    if (!medicineData.category_id || !medicineData.brand_name || isNaN(medicineData.price) || isNaN(medicineData.stock_quantity)) {
        alert("الرجاء تعبئة جميع الحقول المطلوبة");
        return;
    }

    try {
        let url = `${API_BASE}/medicines`;
        let method = "POST";
        
        if (currentEditId) {
            url = `${API_BASE}/medicines/${currentEditId}`;
            method = "PUT";
        }

        const response = await fetch(url, {
            method: method,
            headers: {
                'Authorization': `Bearer ${TOKEN}`,
                'Accept': 'application/json',
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(medicineData)
        });

        const result = await response.json();
        
        if (response.ok) {
            alert(currentEditId ? "تم تحديث الدواء بنجاح" : "تم إضافة الدواء بنجاح");
            closeModal();
            
            // IMPORTANT: انتظر ثانيتين ثم أعد التحميل بدون كاش
            setTimeout(() => {
                fetchMedicines();
                // قم بتحديث الصفحة بالكامل كحل مؤقت
                // location.reload(); // فك تعليق هذا السطر إذا استمرت المشكلة
            }, 1000);
            
        } else {
            let errorMessage = "فشل في حفظ الدواء\n";
            if (result.errors) {
                Object.keys(result.errors).forEach(key => {
                    errorMessage += `\n${key}: ${result.errors[key].join(', ')}`;
                });
            } else if (result.message) {
                errorMessage += result.message;
            }
            alert(errorMessage);
        }

    } catch (error) {
        console.error(error);
        alert("خطأ في الاتصال بالخادم");
    }
}

// Delete Medicine
async function deleteMedicine(id) {
    if (!confirm("هل أنت متأكد من حذف هذا الدواء؟")) return;

    try {
        const response = await fetch(`${API_BASE}/medicines/${id}`, {
            method: "DELETE",
            headers: {
                Authorization: `Bearer ${TOKEN}`,
                Accept: "application/json"
            }
        });

        const result = await response.json();
        console.log("DELETE RESULT:", result);

        if (response.ok) {
            alert("تم حذف الدواء بنجاح");
            await fetchMedicines(); // تحديث القائمة
        } else {
            alert(result.message || "فشل الحذف");
        }

    } catch (err) {
        console.error("Delete error:", err);
        alert("خطأ في الاتصال بالخادم");
    }
}

function logout() {
    localStorage.removeItem("token");
    window.location.href = "../login.html";
}

// Search functionality
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    if (searchInput) {
        searchInput.addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            if (!searchTerm) {
                renderTable(medicinesData);
            } else {
                const filtered = medicinesData.filter(med => 
                    med.brand_name?.toLowerCase().includes(searchTerm) ||
                    med.scientific_name?.toLowerCase().includes(searchTerm)
                );
                renderTable(filtered);
            }
        });
    }
});
