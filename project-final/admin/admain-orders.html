<style>
  body { font-family: 'Manrope', sans-serif; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  .order-row { transition: background 0.15s; }
  .order-row:hover { background-color: #f8fafc; }

  /* Modal animation */
  .modal-backdrop { animation: fadeIn 0.2s ease; }
  .modal-card { animation: slideUp 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(24px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }

  /* Status badges */
  .badge-pending   { background:#fef3c7; color:#92400e; }
  .badge-confirmed { background:#dbeafe; color:#1e40af; }
  .badge-completed { background:#d1fae5; color:#065f46; }
  .badge-rejected  { background:#fee2e2; color:#991b1b; }

  /* Action buttons in modal */
  .action-btn { transition: all 0.15s; }
  .action-btn:hover { transform: translateY(-1px); }
  .action-btn:active { transform: translateY(0); }

  /* Toast */
  #toast {
    position: fixed; bottom: 24px; right: 24px; z-index: 9999;
    padding: 14px 22px; border-radius: 14px;
    font-weight: 600; font-size: 14px;
    display: flex; align-items: center; gap: 10px;
    transform: translateY(80px); opacity: 0;
    transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
    pointer-events: none; min-width: 260px;
  }
  #toast.show { transform: translateY(0); opacity: 1; }
  #toast.success { background: #065f46; color: #fff; }
  #toast.error   { background: #991b1b; color: #fff; }
</style>

<!-- ===== TOAST ===== -->
<div id="toast">
  <span id="toast-icon" class="material-symbols-outlined" style="font-size:20px;"></span>
  <span id="toast-msg"></span>
</div>

<script>
const API_BASE = "http://127.0.0.1:8000/api/v1";
const TOKEN = localStorage.getItem("token");
  // const token = localStorage.getItem("token");
    const USER_ROLE = localStorage.getItem("role");
if (!TOKEN ||(!USER_ROLE ||USER_ROLE.toLowerCase() !=="admin")) {
    window.location.href = "/login.html";
}
let allOrders = [];
let currentOrderId = null;

// ─── Toast ───────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  const icon = document.getElementById('toast-icon');
  t.className = `show ${type}`;
  icon.textContent = type === 'success' ? 'check_circle' : 'error';
  document.getElementById('toast-msg').textContent = msg;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { t.className = t.className.replace('show', '').trim(); }, 3000);
}

// ─── Fetch Orders ─────────────────────────────────────────
async function fetchAdminOrders() {
  const tbody = document.getElementById('orders-body');
  const token = localStorage.getItem("token");
  tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 text-secondary">
    <span class="material-symbols-outlined animate-spin" style="font-size:32px;">autorenew</span>
  </td></tr>`;

  try {
    const res = await fetch(`${API_BASE}/admin/orders`, {
      headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
    });

    if (res.status === 403) {
      tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 text-error">403 – Access Denied (Admin only)</td></tr>`;
      return;
    }

    const result = await res.json();
    allOrders = result.data?.data || result.data || [];
    renderOrders(allOrders);
  } catch (err) {
    console.error(err);
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 text-error">Failed to connect to server</td></tr>`;
  }
}

// ─── Helpers ──────────────────────────────────────────────
function getCustomerName(order) {
  if (order.user?.name) return order.user.name;
  if (order.notes) {
    const m = order.notes.match(/Name:\s*([^\n]+)/i);
    if (m) return m[1].trim();
  }
  return 'Unknown';
}

function badgeClass(status) {
  const map = { pending: 'badge-pending', confirmed: 'badge-confirmed', completed: 'badge-completed', rejected: 'badge-rejected' };
  return map[status] || 'badge-pending';
}

// ─── Render Table ─────────────────────────────────────────
function renderOrders(orders) {
  const tbody = document.getElementById('orders-body');
  tbody.innerHTML = '';

  if (!orders.length) {
    tbody.innerHTML = `<tr><td colspan="6" class="text-center py-16 text-secondary">No orders found</td></tr>`;
    return;
  }

  orders.forEach(order => {
    const name = getCustomerName(order);
    const date = new Date(order.created_at).toLocaleDateString();
    tbody.innerHTML += `
      <tr class="order-row">
        <td class="px-6 py-5 font-semibold">#${order.id}</td>
        <td class="px-6 py-5">${name}</td>
        <td class="px-6 py-5 font-semibold">${order.total_price} ₪</td>
        <td class="px-6 py-5">
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${badgeClass(order.status)}">
            ${order.status}
          </span>
        </td>
        <td class="px-6 py-5 text-secondary text-sm">${date}</td>
        <td class="px-6 py-5 text-right">
          <div class="flex justify-end gap-2">
            <button onclick="viewOrder(${order.id})" title="View"
              class="p-2 hover:bg-blue-50 text-blue-600 rounded-xl transition-colors">
              <span class="material-symbols-outlined" style="font-size:20px;">visibility</span>
            </button>
            <button onclick="openActionModal(${order.id})" title="Update Status"
              class="p-2 hover:bg-amber-50 text-amber-600 rounded-xl transition-colors">
              <span class="material-symbols-outlined" style="font-size:20px;">edit</span>
            </button>
            <button onclick="deleteOrder(this, ${order.id})" title="Delete"
              class="p-2 hover:bg-red-50 text-red-600 rounded-xl transition-colors">
              <span class="material-symbols-outlined" style="font-size:20px;">delete</span>
            </button>
          </div>
        </td>
      </tr>`;
  });
}

// ─── View Modal ───────────────────────────────────────────
function viewOrder(id) {
  const order = allOrders.find(o => o.id === id);
  if (!order) return;

  const name = getCustomerName(order);
  const items = (order.items || []).map(item => `
    <tr class="border-b border-slate-border last:border-0">
      <td class="py-3 text-sm">${item.brand_name}</td>
      <td class="py-3 text-sm text-center">${item.quantity}</td>
      <td class="py-3 text-sm text-right font-semibold">${item.subtotal} ₪</td>
    </tr>`).join('');

  document.getElementById('modal-title').textContent = `Order #${order.id}`;
  document.getElementById('modal-body').innerHTML = `
    <div class="space-y-6">
      <div class="grid grid-cols-2 gap-4">
        <div class="bg-surface-container-low rounded-2xl p-4">
          <p class="text-xs text-secondary mb-1 uppercase tracking-wider">Customer</p>
          <p class="font-semibold">${name}</p>
        </div>
        <div class="bg-surface-container-low rounded-2xl p-4">
          <p class="text-xs text-secondary mb-1 uppercase tracking-wider">Status</p>
          <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${badgeClass(order.status)}">${order.status}</span>
        </div>
        <div class="bg-surface-container-low rounded-2xl p-4">
          <p class="text-xs text-secondary mb-1 uppercase tracking-wider">Total</p>
          <p class="font-bold text-lg text-primary">${order.total_price} ₪</p>
        </div>
        <div class="bg-surface-container-low rounded-2xl p-4">
          <p class="text-xs text-secondary mb-1 uppercase tracking-wider">Date</p>
          <p class="font-semibold">${new Date(order.created_at).toLocaleDateString()}</p>
        </div>
      </div>
      ${order.notes ? `<div class="bg-surface-container-low rounded-2xl p-4">
        <p class="text-xs text-secondary mb-2 uppercase tracking-wider">Customer Notes</p>
        <p class="text-sm">${order.notes}</p>
      </div>` : ''}
      ${order.admin_notes ? `<div class="bg-amber-50 rounded-2xl p-4">
        <p class="text-xs text-amber-700 mb-2 uppercase tracking-wider font-bold">Admin Notes</p>
        <p class="text-sm text-amber-900">${order.admin_notes}</p>
      </div>` : ''}
      ${items ? `<div>
        <p class="text-xs text-secondary mb-3 uppercase tracking-wider font-bold">Order Items</p>
        <table class="w-full">
          <thead><tr class="border-b border-slate-border">
            <th class="text-left text-xs text-secondary pb-2">Medicine</th>
            <th class="text-center text-xs text-secondary pb-2">Qty</th>
            <th class="text-right text-xs text-secondary pb-2">Subtotal</th>
          </tr></thead>
          <tbody>${items}</tbody>
        </table>
      </div>` : ''}
    </div>`;

  document.getElementById('view-modal').classList.remove('hidden');
}

// ─── Action Modal ─────────────────────────────────────────
/*
  Status Flow:
  pending   → can: confirm | reject
  confirmed → can: complete | reject
  completed → no actions
  rejected  → no actions
*/
function openActionModal(id) {
  const order = allOrders.find(o => o.id === id);
  if (!order) return;
  currentOrderId = id;

  const statusLabels = {
    pending:   '🟡 Pending – waiting for confirmation',
    confirmed: '🔵 Confirmed – ready to complete',
    completed: '🟢 Completed',
    rejected:  '🔴 Rejected'
  };

  document.getElementById('action-modal-title').textContent = `Update Order #${id}`;
  document.getElementById('action-status-info').innerHTML =
    `<span class="font-semibold">Current Status:</span> ${statusLabels[order.status] || order.status}`;
  document.getElementById('action-notes').value = '';

  const btns = document.getElementById('action-buttons');

  if (order.status === 'pending') {
    btns.innerHTML = `
      <button onclick="updateOrderStatus('confirm')"
        class="action-btn w-full py-3.5 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white font-bold flex items-center justify-center gap-2">
        <span class="material-symbols-outlined" style="font-size:20px;">thumb_up</span> Confirm Order
      </button>
      <button onclick="updateOrderStatus('reject')"
        class="action-btn w-full py-3.5 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 font-bold flex items-center justify-center gap-2 border border-red-200">
        <span class="material-symbols-outlined" style="font-size:20px;">thumb_down</span> Reject Order
      </button>`;

  } else if (order.status === 'confirmed') {
    btns.innerHTML = `
      <button onclick="updateOrderStatus('complete')"
        class="action-btn w-full py-3.5 rounded-2xl bg-primary hover:bg-primary/90 text-white font-bold flex items-center justify-center gap-2">
        <span class="material-symbols-outlined" style="font-size:20px;">check_circle</span> Mark as Completed
      </button>
      <button onclick="updateOrderStatus('reject')"
        class="action-btn w-full py-3.5 rounded-2xl bg-red-50 hover:bg-red-100 text-red-700 font-bold flex items-center justify-center gap-2 border border-red-200">
        <span class="material-symbols-outlined" style="font-size:20px;">thumb_down</span> Reject Order
      </button>`;

  } else {
    btns.innerHTML = `
      <div class="text-center text-secondary py-4 text-sm">
        No actions available for <strong>${order.status}</strong> orders.
      </div>`;
  }

  document.getElementById('action-modal').classList.remove('hidden');
}

// ─── Update Status API Call ────────────────────────────────
async function updateOrderStatus(action) {
  const id = currentOrderId;
  const notes = document.getElementById('action-notes').value.trim();
  const token = localStorage.getItem("token");

  // Map action → endpoint
  const endpoints = {
    confirm:  `${API_BASE}/admin/orders/${id}/confirm`,
    complete: `${API_BASE}/admin/orders/${id}/complete`,
    reject:   `${API_BASE}/admin/orders/${id}/reject`,
  };

  const endpoint = endpoints[action];
  if (!endpoint) return;

  // Disable buttons during request
  document.getElementById('action-buttons').querySelectorAll('button').forEach(b => {
    b.disabled = true;
    b.classList.add('opacity-60', 'cursor-not-allowed');
  });

  try {
    const res = await fetch(endpoint, {
      method: 'PATCH',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },
      body: JSON.stringify({ admin_notes: notes || null })
    });

    const result = await res.json();

    if (result.success) {
      // Update local state
      const idx = allOrders.findIndex(o => o.id === id);
      if (idx !== -1) {
        allOrders[idx].status = result.data.status;
        allOrders[idx].admin_notes = result.data.admin_notes;
      }
      renderOrders(allOrders);
      closeModal('action-modal');
      showToast(`✅ Order #${id} updated to "${result.data.status}"`, 'success');
    } else {
      showToast(result.message || 'Update failed', 'error');
      // Re-enable buttons
      document.getElementById('action-buttons').querySelectorAll('button').forEach(b => {
        b.disabled = false;
        b.classList.remove('opacity-60', 'cursor-not-allowed');
      });
    }
  } catch (err) {
    console.error(err);
    showToast('Connection error', 'error');
    document.getElementById('action-buttons').querySelectorAll('button').forEach(b => {
      b.disabled = false;
      b.classList.remove('opacity-60', 'cursor-not-allowed');
    });
  }
}

// ─── Delete ───────────────────────────────────────────────
function deleteOrder(btn, id) {
  if (!confirm(`Delete Order #${id}?`)) return;
  const row = btn.closest('tr');
  row.style.transition = 'opacity 0.3s';
  row.style.opacity = '0';
  setTimeout(() => {
    row.remove();
    allOrders = allOrders.filter(o => o.id !== id);
  }, 300);
}

// ─── Modals ───────────────────────────────────────────────
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

// Close on backdrop click
['view-modal', 'action-modal'].forEach(id => {
  document.getElementById(id).addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal(id);
  });
});

// ─── Search ───────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', (e) => {
  const term = e.target.value.toLowerCase().trim();
  if (!term) return renderOrders(allOrders);
  const filtered = allOrders.filter(o =>
    o.id.toString().includes(term) ||
    getCustomerName(o).toLowerCase().includes(term)
  );
  renderOrders(filtered);
});

// ─── Logout ───────────────────────────────────────────────
function logout() {
    localStorage.removeItem("token");
    window.location.href = "../login.html";
}

// ─── Init ─────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', fetchAdminOrders);
</script>
