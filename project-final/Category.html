<script src="nav.js"></script>
<script>
async function renderCategories() {
    const grid = document.getElementById('categories-grid');

    // 🔐 جيبي التوكن
    const AUTH_TOKEN = localStorage.getItem("token");
    const USER_ROLE = localStorage.getItem("role");
if (!AUTH_TOKEN ||(USER_ROLE && USER_ROLE.toLowerCase()=="admin")) {
    window.location.href = "login.html";
}

    // ❗ لو ما في توكن → رجعيه للوقن
    /*if (!AUTH_TOKEN) {
        window.location.href = "login.html";
        return;
    }*/

    try {
        const response = await fetch('http://127.0.0.1:8000/api/v1/categories', {
            method: 'GET',
            headers: {
                'Accept': 'application/json',
                'Authorization': `Bearer ${AUTH_TOKEN}`
            }
        });

        const result = await response.json();
        console.log(result);
        const categories = result.data || [];

        if (categories.length === 0) {
            grid.innerHTML = '<p class="text-on-surface-variant font-body-lg col-span-full text-center py-xl">No categories found.</p>';
            return;
        }

        grid.innerHTML = '';

        categories.forEach(cat => {
            const card = document.createElement('div');
            card.className = 'category-card group bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 flex flex-col cursor-pointer';
            card.onclick = () => {
    window.location.href = `Categorys Products Page.html?id=${cat.id}`;
};
            /*const imgUrl = cat.image
  ? cat.image
  : `https://ui-avatars.com/api/?name=${encodeURIComponent(cat.name)}&background=374151`;*/
            const imgUrl = (cat.image && cat.image.trim() !== "")
  ? cat.image
  : `https://placehold.co/400x400/374151/ffffff?text=${encodeURIComponent(cat.name)}`;
            const productCount = cat.medicines_count || 0;

            card.innerHTML = `
                <div class="relative h-48 overflow-hidden">
                    <img src="${imgUrl}" 
                         class="category-image w-full h-full object-cover transition-transform duration-500"
                         alt="${cat.name}">
                    <div class="absolute top-4 right-4">
                        <span class="bg-primary-container text-on-primary-container px-sm py-1 rounded-full font-label-sm shadow-sm">
                            ${productCount} Products
                        </span>
                    </div>
                </div>
                <div class="p-md flex flex-col flex-grow">
                    <h3 class="font-headline-md text-on-surface mb-xs group-hover:text-primary transition-colors">${cat.name}</h3>
                    <p class="text-on-surface-variant font-body-md line-clamp-2 mb-md flex-grow">${cat.description || ''}</p>
                   
                </div>
            `;
            grid.appendChild(card);
        });

    } catch (error) {
        console.error('Error fetching categories:', error);
        grid.innerHTML = '<p class="text-error font-body-lg col-span-full text-center py-xl">Failed to load categories. Please try again later.</p>';
    }
    
}

window.addEventListener('DOMContentLoaded', renderCategories);
</script>
