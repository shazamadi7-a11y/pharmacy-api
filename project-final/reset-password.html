<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">

    <h2 class="text-2xl font-bold mb-4 text-center">Reset Password</h2>

    <form id="resetForm" class="space-y-4">

        <input id="password" type="password" placeholder="New Password"
            class="w-full px-4 py-3 border rounded-lg" required>

        <input id="confirm" type="password" placeholder="Confirm Password"
            class="w-full px-4 py-3 border rounded-lg" required>

        <button class="w-full bg-green-700 text-white py-3 rounded-lg">
            Reset Password
        </button>
    </form>

</div>

<script>
document.getElementById("resetForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const email = params.get("email");

    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (!token || token === "GET_FROM_BACKEND") {
        alert("Invalid reset link. Use real token from backend log/email.");
        return;
    }

    const res = await fetch("http://127.0.0.1:8000/api/v1/reset-password", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({
            token,
            email,
            password,
            password_confirmation: confirm
        })
    });

    const data = await res.json();
    console.log(data);

    if (data.success) {
        alert("Password reset successful");
        window.location.href = "login.html";
    } else {
        alert(data.message || "Reset failed");
    }
});
</script>

</body>
</html>
