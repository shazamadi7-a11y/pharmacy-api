<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md bg-white p-8 rounded-lg shadow-lg">

    <h2 class="text-2xl font-bold mb-4 text-center">Forgot Password</h2>

    <form id="forgotForm" class="space-y-4">
        <input id="email" type="email" placeholder="Enter your email"
            class="w-full px-4 py-3 border rounded-lg" required>

        <button class="w-full bg-green-700 text-white py-3 rounded-lg">
            Send Reset Link
        </button>
    </form>

    <!-- RESULT BOX -->
    <div id="resultBox" class="hidden mt-6">
        <p class="text-green-700 text-sm mb-2">Reset link:</p>
        <input id="resetLink" class="w-full border p-2 rounded" readonly>
        <button onclick="copyLink()" class="w-full mt-2 bg-black text-white py-2 rounded">
            Copy Link
        </button>
    </div>

</div>

<script>
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value;

    const res = await fetch("http://127.0.0.1:8000/api/v1/forgot-password", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
        },
        body: JSON.stringify({ email })
    });

    const data = await res.json();
    console.log(data);

    if (data.success) {

        alert("Check console or backend log for real reset link");

        // ⚠️ للتجربة فقط (لازم تستبدليه باللينك الحقيقي من الباك)
        const fakeLink =
        `http://127.0.0.1:5500/reset-password.html?token=GET_FROM_BACKEND&email=${email}`;

        document.getElementById("resultBox").classList.remove("hidden");
        document.getElementById("resetLink").value = fakeLink;

    } else {
        alert(data.message || "Error");
    }
});

function copyLink() {
    const input = document.getElementById("resetLink");
    input.select();
    document.execCommand("copy");
    alert("Copied!");
}
</script>

</body>
</html>
